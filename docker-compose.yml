services:

  # ==========================================================
  # TRAEFIK
  # ==========================================================
  traefik:
    image: traefik:v3.7
    container_name: rentiq-traefik
    restart: unless-stopped

    command:
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # HTTP
      - "--entrypoints.web.address=:80"

      # HTTPS + WebSocket
      - "--entrypoints.websecure.address=:443"

      # Redirect HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

      # Logging
      - "--log.level=INFO"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt

    networks:
      - rentiq-network


  # ==========================================================
  # RENTIQ POSTGIS DATABASE
  # ==========================================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: rentiq-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    # Public because you want your LOCAL Spring Boot
    # to connect to the OVH database.
    #
    # Later restrict port 5434 to your own public IP.
    ports:
      - "${DB_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - rentiq-network


  # ==========================================================
  # KEYCLOAK DATABASE
  # ==========================================================
  keycloak-db:
    image: postgres:16-alpine
    container_name: rentiq-keycloak-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - rentiq-network


  # ==========================================================
  # KEYCLOAK
  # ==========================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: rentiq-keycloak
    restart: unless-stopped

    command:
      - start
      - --import-realm

    environment:
      # ------------------------------------------------------
      # DATABASE
      # ------------------------------------------------------
      KC_DB: postgres

      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}

      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}


      # ------------------------------------------------------
      # KEYCLOAK ADMIN
      # ------------------------------------------------------
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}


      # ------------------------------------------------------
      # TRAEFIK / PROXY
      # ------------------------------------------------------
      KC_HTTP_ENABLED: "true"

      KC_PROXY_HEADERS: xforwarded

      KC_HOSTNAME: https://${AUTH_DOMAIN}

      KC_HOSTNAME_STRICT: "true"


      # ------------------------------------------------------
      # HEALTH / METRICS
      # ------------------------------------------------------
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"


      # ------------------------------------------------------
      # JAVA MEMORY
      # ------------------------------------------------------
      JAVA_OPTS_APPEND: "-Xms512m -Xmx2048m"

    volumes:
      # Put your exported rentiq-app realm JSON here
      - ./keycloak/import:/opt/keycloak/data/import

      # Custom Keycloak themes
      - ./keycloak/themes:/opt/keycloak/themes

    depends_on:
      keycloak-db:
        condition: service_healthy

    labels:
      - "traefik.enable=true"

      # -------------------------
      # Keycloak router
      # -------------------------
      - "traefik.http.routers.keycloak.rule=Host(`${AUTH_DOMAIN}`)"

      - "traefik.http.routers.keycloak.entrypoints=websecure"

      - "traefik.http.routers.keycloak.tls=true"

      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"

      # Keycloak runs internally on 8080
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

    networks:
      - rentiq-network


  # ==========================================================
  # SPRING BOOT BACKEND
  # ==========================================================
  backend:
    image: rentiq-backend:latest
    container_name: rentiq-backend

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:

      # ------------------------------------------------------
      # DATABASE
      # ------------------------------------------------------
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_URL: ${DB_URL}


      # ------------------------------------------------------
      # KEYCLOAK
      # These match your existing Spring Boot variables
      # ------------------------------------------------------
      ISSUER_URI: ${ISSUER_URI}

      SERVER_URL: ${SERVER_URL}

      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}

      REALM: ${REALM}
      TARGET_REALM: ${TARGET_REALM}


      # ------------------------------------------------------
      # FRONTEND / COOKIE
      # ------------------------------------------------------
      FRONTEND_URL: ${FRONTEND_URL}

      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}


      # ------------------------------------------------------
      # CLOUDINARY
      # ------------------------------------------------------
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}

      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}

      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}


      # ------------------------------------------------------
      # SPRING
      # ------------------------------------------------------
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

    # This helps Spring Boot running inside Docker reach
    # auth.rentiq.com through Traefik on the same OVH host.
    extra_hosts:
      - "${AUTH_DOMAIN}:host-gateway"

    depends_on:
      db:
        condition: service_healthy

      keycloak:
        condition: service_started

    labels:
      - "traefik.enable=true"

      # -------------------------
      # Spring Boot router
      # -------------------------
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN}`)"

      - "traefik.http.routers.backend.entrypoints=websecure"

      - "traefik.http.routers.backend.tls=true"

      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"

      # Spring Boot internal port
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

    networks:
      - rentiq-network


# ==========================================================
# NETWORK
# ==========================================================
networks:
  rentiq-network:
    name: rentiq-network
    driver: bridge


# ==========================================================
# VOLUMES
# ==========================================================
volumes:
  postgres_data:
  keycloak_postgres_data:
  traefik_letsencrypt: