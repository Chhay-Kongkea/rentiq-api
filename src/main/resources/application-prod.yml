spring:

  # ==========================================================
  # PRODUCTION DATABASE
  # ==========================================================
  datasource:
    url: "${DB_URL:jdbc:postgresql://db:5432/rentiq_db}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


  # ==========================================================
  # PRODUCTION JPA
  # ==========================================================
  jpa:
    show-sql: false

    hibernate:
      ddl-auto: update


# ==========================================================
# PRODUCTION SERVER
# ==========================================================
server:
  port: "${PORT:8080}"

  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        http-only: true
        secure: "${SESSION_COOKIE_SECURE:true}"
        same-site: lax


# ==========================================================
# PRODUCTION FRONTEND
# ==========================================================
app:
  frontend-url: "${FRONTEND_URL}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}"


# ==========================================================
# PRODUCTION LOGGING
# ==========================================================
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.hibernate.SQL: WARN