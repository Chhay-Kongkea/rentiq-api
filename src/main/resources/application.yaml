spring:
  application:
    name: rentiq-api

  datasource:
#    url: ${DB_URL:jdbc:postgresql://localhost:5435/rentiq_db}
#    username: ${DB_USER:postgres}
#    password: ${DB_PASSWORD:postgres}
#    driver-class-name: org.postgresql.Driver


    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:http://127.0.0.1:8080/realms/elearning-001}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8282

keycloak:
  server-url: ${SERVER_URL:http://127.0.0.1:8080}
  client-id: ${CLIENT_ID:spring-boot-eleaning-002}
  client-secret: ${CLIENT_SECRET:}
  realm: ${REALM:master}
  target-realm: ${TARGET_REALM:elearning-001}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}